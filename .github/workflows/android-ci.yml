name: Android CI

on:
  push:
    branches: [ main, master, 'feature/**', 'testing/**' ]
  pull_request:
    branches: [ main, master, 'feature/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          cache-cleanup: on-success

      - name: Select Gradle command
        id: gradle
        shell: bash
        run: |
          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            chmod +x gradlew
            echo 'cmd=./gradlew' >> "$GITHUB_OUTPUT"
          else
            echo 'Wrapper JAR is not tracked; using the runner Gradle installation.'
            echo 'cmd=gradle' >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        run: ${{ steps.gradle.outputs.cmd }} assembleDebug --build-cache

      - name: Run Lint
        run: ${{ steps.gradle.outputs.cmd }} lintDebug

      - name: Run Unit Tests
        run: ${{ steps.gradle.outputs.cmd }} testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run ktlint when configured
        shell: bash
        run: |
          if ${{ steps.gradle.outputs.cmd }} tasks --all | grep -q '^ktlintCheck'; then
            ${{ steps.gradle.outputs.cmd }} ktlintCheck
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
